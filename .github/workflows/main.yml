name: Build Windows EXE

on:
  workflow_dispatch:        # manuell starten
  push:
    tags: ['v*']            # oder automatisch bei Tag, z.B. v1.0.1

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tweak-tool
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx electron-builder --win portable --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Attack-tweaks
          path: tweak-tool/dist/Attack-tweaks.exe

      - name: Release erstellen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tweak-tool/dist/Attack-tweaks.exe
